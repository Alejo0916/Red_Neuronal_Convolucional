name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Verificación del proyecto
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          # 3.13 es la versión con wheels disponibles para todas las dependencias fijadas.
          python-version: "3.13"
          cache: pip

      - name: Configurar Node.js (para OpenSpec)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar PyTorch (wheels de CPU)
        run: |
          python -m pip install --upgrade pip
          # El índice de PyTorch no incluye las dependencias transitivas, por eso
          # se añade PyPI como índice extra.
          pip install torch==2.15.0+cpu \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple

      - name: Instalar el resto de dependencias
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Comprobar que el paquete `src` es importable
        run: |
          python -c "import src; from src import config, data, model, train, evaluate, predict; print('src OK ->', src.__version__)"

      - name: Comprobar la sintaxis de la aplicación Streamlit
        run: python -m py_compile app/app.py

      - name: Comprobar que el modelo entrenado carga y predice
        run: |
          python - <<'PY'
          from PIL import Image
          import numpy as np
          from src.config import CHECKPOINT_PATH, METADATA_PATH
          from src.predict import load_model, predict_image

          model, metadata = load_model(CHECKPOINT_PATH, METADATA_PATH, device="cpu")
          imagen = Image.fromarray(np.random.randint(0, 256, (32, 32, 3), dtype=np.uint8))
          prediccion = predict_image(model, imagen, device="cpu")
          assert prediccion.class_name in metadata["classes"], prediccion
          assert abs(sum(prediccion.probabilities) - 1.0) < 1e-5
          print(f"Modelo OK -> {prediccion.class_name} ({prediccion.confidence:.2%})")
          PY

      - name: Ejecutar las pruebas unitarias
        run: python -m pytest tests -q

      - name: Validar las especificaciones de OpenSpec
        run: npx --yes @fission-ai/openspec@latest validate --specs --strict

      - name: Comprobar que el README documenta los comandos principales
        run: |
          grep -q "streamlit run app/app.py" README.md
          grep -q "python -m src.train" README.md
          grep -q "python -m src.evaluate" README.md
          grep -q "python tools/download_cifar10.py" README.md
          echo "README OK"
